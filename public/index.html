<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fotobanka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f5f7f8; --panel:#fff; --ink:#14232a; --muted:#61737a; --line:#e3e9eb; --brand:#21b8c4; --brand-ink:#04363b; --sel:#0e9aa6; --danger:#c2412d; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 Inter, system-ui, sans-serif; background: var(--bg); color: var(--ink); }
  button, input, select { font: inherit; }
  .app { display: grid; grid-template-columns: 300px 1fr; min-height: 100vh; }
  aside { background: var(--panel); border-right: 1px solid var(--line); position: sticky; top: 0; height: 100vh; overflow: auto; display: flex; flex-direction: column; }
  .brand { padding: 16px 18px 12px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); }
  .brand i { width: 28px; height: 28px; border-radius: 8px; background: var(--brand); display: block; flex-shrink: 0; }
  .brand b { font-size: 16px; } .brand small { display: block; color: var(--muted); font-size: 12px; font-weight: 500; }
  .search { padding: 12px 14px 8px; }
  .search input { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; }
  .sec { padding: 6px 16px 4px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .tagcloud { display: flex; flex-wrap: wrap; gap: 5px; padding: 4px 14px 12px; border-bottom: 1px solid var(--line); }
  .chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 3px 9px; font-size: 12px; cursor: pointer; white-space: nowrap; }
  .chip span { color: var(--muted); margin-left: 3px; font-size: 11px; }
  .chip:hover { border-color: var(--brand); }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); } .chip.on span { color: #cfd8da; }
  nav { padding: 4px 0 20px; }
  nav button { all: unset; display: flex; justify-content: space-between; gap: 8px; width: 100%; box-sizing: border-box; padding: 8px 16px; cursor: pointer; border-left: 3px solid transparent; }
  nav button:hover { background: #f1f7f8; }
  nav button.on { background: #e8f8f9; border-left-color: var(--brand); font-weight: 600; }
  nav .cnt { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  nav .cnt.ok { color: var(--sel); font-weight: 600; }
  nav .match { display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
  main { padding: 22px 28px 60px; min-width: 0; }
  .top { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  h1 { margin: 0; font-size: 22px; }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .btn { border: 1px solid var(--line); background: #fff; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: 500; color: var(--ink); text-decoration: none; }
  .btn:hover { border-color: var(--brand); }
  .btn.pri { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); font-weight: 600; }
  .btn.danger { color: var(--danger); }
  .btn:disabled { opacity: .5; cursor: wait; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
  .tabs button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; cursor: pointer; }
  .tabs button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .tabs button span { opacity: .65; margin-left: 4px; font-size: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .row input { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; min-width: 260px; }
  .row select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; }
  .hint { color: var(--muted); font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .ph { position: relative; border-radius: 12px; overflow: hidden; background: #dde5e7; border: 3px solid transparent; }
  .ph .img { aspect-ratio: 3/2; cursor: zoom-in; display: block; width: 100%; overflow: hidden; }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .4s; }
  .ph:hover img { transform: scale(1.03); }
  .ph.sel { border-color: var(--sel); }
  .ph .chk { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); display: grid; place-items: center; font-weight: 700; font-size: 15px; color: #6f8287; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  .ph .chk:hover { color: var(--sel); }
  .ph.sel .chk { background: var(--sel); color: #fff; }
  .ph.sel .chk:hover { background: var(--danger); }
  .ph .meta { padding: 7px 9px 9px; background: #fff; }
  .ph .meta .by { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ph .meta .tags { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; min-height: 18px; }
  .ph .meta .tags span { font-size: 10.5px; background: #eef4f5; border-radius: 999px; padding: 1px 7px; color: #35505a; cursor: pointer; }
  .ph .meta .tags span:hover { background: #d9f2f4; }
  .ph .res { position: absolute; left: 8px; top: 8px; font-size: 10.5px; padding: 2px 7px; border-radius: 6px; background: rgba(0,0,0,.55); color: #fff; }
  h2 { font-size: 15px; margin: 24px 0 10px; display: flex; gap: 8px; align-items: baseline; }
  h2 small { color: var(--muted); font-weight: 500; }
  .more { margin: 16px auto 0; display: block; }
  .empty { padding: 40px; text-align: center; color: var(--muted); background: #fff; border: 1px dashed var(--line); border-radius: 12px; }
  .toast { position: fixed; right: 18px; bottom: 18px; background: var(--ink); color: #fff; padding: 10px 14px; border-radius: 10px; max-width: 440px; opacity: 0; transform: translateY(8px); transition: .25s; white-space: pre-line; z-index: 10; pointer-events: none; }
  .toast.on { opacity: 1; transform: none; }
  dialog { border: 0; padding: 0; border-radius: 14px; width: min(1280px, 96vw); max-height: 94vh; background: #0d1416; color: #fff; overflow: hidden; }
  dialog::backdrop { background: rgba(0,0,0,.82); }
  .dl { display: grid; grid-template-columns: minmax(0, 1fr) 320px; max-height: 94vh; }
  .dl-img { position: relative; display: grid; place-items: center; background: #000; min-height: 60vh; }
  .dl-img img { max-width: 100%; max-height: 94vh; display: block; }
  .dl-nav { position: absolute; top: 50%; translate: 0 -50%; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,.85); font-size: 20px; cursor: pointer; }
  .dl-prev { left: 12px; } .dl-next { right: 12px; }
  .dl-side { padding: 18px; overflow: auto; display: flex; flex-direction: column; gap: 12px; background: #142024; }
  .dl-side p { margin: 0; font-size: 13px; color: #c9d6d8; }
  .dl-side a { color: #7fe3ea; }
  .dl-side .k { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #8aa0a4; }
  .dl-tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .dl-tags span { background: #22343a; border-radius: 999px; padding: 3px 6px 3px 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px; }
  .dl-tags span button { all: unset; cursor: pointer; padding: 0 4px; color: #9fb3b7; }
  .dl-tags span button:hover { color: #fff; }
  .dl-side input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid #2c4248; background: #0f1a1d; color: #fff; }
  .dl-side .btn { width: 100%; text-align: center; }
  .dl-close { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(255,255,255,.85); cursor: pointer; font-size: 16px; z-index: 2; }
  .sugg { display: flex; flex-wrap: wrap; gap: 4px; }
  .sugg button { all: unset; cursor: pointer; font-size: 11.5px; padding: 2px 8px; border: 1px dashed #3a5258; border-radius: 999px; color: #9fb3b7; }
  .sugg button:hover { color: #fff; border-color: #7fe3ea; }
  /* přepínač Kategorie | Tagy */
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin: 0 14px 8px; padding: 4px; background: #eef3f4; border-radius: 10px; }
  .seg button { border: 0; background: transparent; padding: 7px 8px; border-radius: 7px; cursor: pointer; font-weight: 500; color: var(--muted); }
  .seg button.on { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .seg button span { font-size: 11px; color: var(--muted); margin-left: 3px; font-weight: 500; }
  .pane { flex: 1; overflow: auto; }
  .pane .tagcloud { border-bottom: 0; padding-top: 8px; }
  aside .mine { margin: 8px 14px 14px; }
  aside .mine .btn { width: 100%; text-align: center; display: block; }
  .tagbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: -4px 0 14px; }
  /* podkategorie: přilepená lišta */
  .tabs.stick { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0; margin: 0 0 6px; box-shadow: 0 8px 12px -12px rgba(0,0,0,.25); }
  h2 { scroll-margin-top: 70px; }
  /* spodní lišta výběru */
  .pickbar { position: fixed; left: 50%; bottom: 16px; translate: -50% 0; z-index: 8; display: none; align-items: center; gap: 10px; padding: 8px 8px 8px 16px; background: var(--ink); color: #fff; border-radius: 14px; box-shadow: 0 12px 30px rgba(0,0,0,.3); max-width: calc(100vw - 24px); }
  .pickbar.on { display: flex; }
  .pickbar b { white-space: nowrap; }
  .pickbar .btn { border-color: #34474e; background: #1f3238; color: #fff; white-space: nowrap; }
  .pickbar .btn.pri { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
  .pickbar .prog { font-size: 12px; color: #a9bcc0; white-space: nowrap; }
  .mtop { display: none; }
  @media (max-width: 900px) {
    .app { grid-template-columns: 1fr; }
    .mtop { display: flex; position: sticky; top: 0; z-index: 9; align-items: center; gap: 10px; padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--line); }
    .mtop b { flex: 1; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mtop button { border: 1px solid var(--line); background: #fff; border-radius: 9px; padding: 7px 11px; font-weight: 600; cursor: pointer; }
    aside { position: fixed; inset: 0 auto 0 0; width: min(330px, 88vw); height: 100dvh; z-index: 20; translate: -100% 0; transition: translate .25s; box-shadow: 0 0 40px rgba(0,0,0,.3); }
    body.menu aside { translate: 0 0; }
    body.menu::after { content: ''; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 15; }
    main { padding: 14px 14px 90px; }
    h1 { font-size: 19px; }
    .tabs.stick { top: 55px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -14px; padding-inline: 14px; }
    .tabs button { white-space: nowrap; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
    .ph .meta .by { display: none; }
    .dl { grid-template-columns: 1fr; overflow: auto; } .dl-img { min-height: 40vh; }
    .pickbar { bottom: 10px; padding-left: 12px; gap: 6px; } .pickbar .btn { padding: 7px 9px; }
  }
</style>
</head>
<body>
<div class="mtop"><button id="menuBtn" aria-label="Menu">☰ Menu</button><b id="mTitle">Fotobanka</b></div>
<div class="app">
  <aside>
    <div class="brand"><i></i><div><b>Fotobanka</b><small id="total">—</small></div></div>
    <div class="search"><input id="filter" placeholder="Hledat kategorii nebo tag…" autocomplete="off"></div>
    <div class="seg"><button id="segCat" class="on">Kategorie</button><button id="segTag">Tagy</button></div>
    <div class="pane" id="paneCat"><nav id="nav"></nav></div>
    <div class="pane" id="paneTag" hidden><div class="tagcloud" id="tags"></div></div>
    <div class="mine" id="mine"></div>
  </aside>
  <main id="main"></main>
</div>
<dialog id="dlg"></dialog>
<div class="pickbar" id="pickbar"></div>
<div class="toast" id="toast"></div>

<script>
const $ = (s, r = document) => r.querySelector(s)
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const SRC = { pexels: 'Pexels', pixabay: 'Pixabay', openverse: 'Openverse (CC0)' }
const FILL = 'mix' // hromadné doplnění: Pexels → Pixabay → Openverse
const SUGGEST = ['děti', 'rodina', 'pár', 'přátelé', 'luxus', 'relax', 'akce', 'sport', 'venku', 'uvnitř', 'voda', 'léto', 'zima', 'noc', 'žena', 'muž', 'senioři', 'detail', 'bez lidí']
// Statická verze (GitHub Pages): data ze souboru data.json, výběr jen v prohlížeči (localStorage), bez hledání a úprav
const STATIC = !!window.FOTOBANKA_STATIC
const PICK_KEY = 'fotobanka-vyber'
let picked = new Set(); try { picked = new Set(JSON.parse(localStorage.getItem(PICK_KEY) || '[]')) } catch {}
const savePicked = () => { try { localStorage.setItem(PICK_KEY, JSON.stringify([...picked])) } catch {} }
let S = { categories: [], bank: {} }
let cur = null, view = 'hledat'              // hledat | banka | tag | vyber
let sub = 0, results = [], page = 1, ori = 'landscape', custom = '', src = 'pexels'
let tagSel = []                              // filtr tagů
let subSel = new Set()                       // statická verze: vybrané podkategorie (prázdné = vše)
let shown = []                               // fotky v mřížce: { p, cat, sub } (detail + šipky)
let dlgIdx = -1

const toast = (t) => { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 3500) }
const api = async (url, opt) => { const r = await fetch(url, opt && { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(opt) }); const j = await r.json(); if (!r.ok) throw new Error(j.error || r.status); return j }
const count = (slug) => Object.values(S.bank[slug] || {}).reduce((a, l) => a + l.length, 0)
const allBank = () => S.categories.flatMap((c) => Object.entries(S.bank[c.slug] || {}).flatMap(([s, l]) => l.map((p) => ({ p, cat: c, sub: s }))))
const bankFind = (cat, subName, id) => (S.bank[cat]?.[subName] || []).find((p) => p.id === id)
const hasTags = (p) => tagSel.every((t) => (p.tags || []).includes(t))

async function load() { S = STATIC ? await (await fetch('data.json')).json() : await api('/api/state'); if (!cur) { cur = S.categories[0]; if (count(cur.slug)) view = 'banka' } else cur = S.categories.find((c) => c.slug === cur.slug) || S.categories[0]; renderSide(); render() }

// ---------------------------------------------------------------- levý panel
function tagCounts() { const m = new Map(); for (const { p } of allBank().filter((x) => view === 'vyber' || x.cat.slug === cur?.slug)) for (const t of p.tags || []) m.set(t, (m.get(t) || 0) + 1); return [...m].sort((a, b) => b[1] - a[1]) }
function renderSide() {
  const f = $('#filter').value.trim().toLowerCase()
  $('#total').textContent = `${S.categories.length} kategorií · ${allBank().length} fotek ve fotobance`
  $('#tags').innerHTML = tagCounts().filter(([t]) => !f || t.includes(f) || tagSel.includes(t))
    .map(([t, n]) => `<button class="chip ${tagSel.includes(t) ? 'on' : ''}" data-t="${esc(t)}">${esc(t)}<span>${n}</span></button>`).join('') || '<span class="hint">Žádný tag</span>'
  $('#tags').querySelectorAll('.chip').forEach((b) => b.onclick = () => toggleTag(b.dataset.t))
  $('#segTag').innerHTML = `Tagy${tagSel.length ? `<span>${tagSel.length}</span>` : ''}`
  $('#mine').innerHTML = STATIC ? `<button class="btn ${view === 'vyber' ? 'pri' : ''}" id="mineBtn">Můj výběr (${picked.size})</button>` : ''
  if ($('#mineBtn')) $('#mineBtn').onclick = () => { view = 'vyber'; renderSide(); render(); closeMenu() }
  const bank = allBank()
  $('#nav').innerHTML = S.categories.map((c) => {
    const subHit = f ? c.sub.filter((s) => s[0].toLowerCase().includes(f)).map((s) => s[0]) : []
    const tagHit = f && bank.some((x) => x.cat.slug === c.slug && (x.p.tags || []).some((t) => t.includes(f)))
    if (f && !c.name.toLowerCase().includes(f) && !subHit.length && !tagHit) return ''
    const n = count(c.slug)
    return `<button data-s="${c.slug}" class="${view !== 'vyber' && cur && cur.slug === c.slug ? 'on' : ''}"><span>${esc(c.name)}${subHit.length ? `<small class="match">${esc(subHit.join(', '))}</small>` : ''}</span><span class="cnt ${n ? 'ok' : ''}">${n}</span></button>`
  }).join('')
  $('#nav').querySelectorAll('button').forEach((b) => b.onclick = () => {
    cur = S.categories.find((c) => c.slug === b.dataset.s); sub = 0; results = []; page = 1; custom = ''
    subSel.clear(); view = count(cur.slug) ? 'banka' : 'hledat'
    renderSide(); render(); closeMenu(); scrollTo(0, 0); if (view === 'hledat') search()
  })
  if (f) { const catHit = $('#nav button'), tagHit = $('#tags .chip'); if (!catHit && tagHit) showPane('tag') }
}
function showPane(w) { $('#paneCat').hidden = w !== 'cat'; $('#paneTag').hidden = w !== 'tag'; $('#segCat').classList.toggle('on', w === 'cat'); $('#segTag').classList.toggle('on', w === 'tag') }
const closeMenu = () => document.body.classList.remove('menu')
function toggleTag(t) {
  tagSel = tagSel.includes(t) ? tagSel.filter((x) => x !== t) : [...tagSel, t]
  if (view === 'hledat') view = 'banka'
  renderSide(); render()
}

// ---------------------------------------------------------------- mřížka
function card(p, cat, subName, i) {
  const on = STATIC ? picked.has(p.id) : !!bankFind(cat.slug, subName, p.id)
  const tags = (p.tags || []).map((t) => `<span data-tag="${esc(t)}">${esc(t)}</span>`).join('')
  return `<div class="ph ${on ? 'sel' : ''}" data-i="${i}">
    <a class="img" data-open="${i}" href="${esc(p.large)}"><img loading="lazy" src="${esc(p.thumb)}" alt="${esc(p.alt)}"></a>
    ${p.w ? `<span class="res">${p.w}×${p.h}</span>` : ''}
    <button class="chk" data-pick="${i}" title="${STATIC ? (on ? 'Odebrat z výběru' : 'Přidat do výběru') : on ? 'Odebrat z fotobanky' : 'Vybrat do fotobanky'}">${on ? '✓' : '+'}</button>
    <div class="meta"><div class="by">${esc(p.source || '')}${p.photographer ? ' · ' + esc(p.photographer) : ''} · ${esc(subName)}</div><div class="tags">${tags}</div></div>
  </div>`
}
function bindGrid() {
  $('#main').querySelectorAll('[data-open]').forEach((a) => a.onclick = (e) => { e.preventDefault(); openDetail(+a.dataset.open) })
  $('#main').querySelectorAll('[data-pick]').forEach((b) => b.onclick = () => pick(+b.dataset.pick))
  $('#main').querySelectorAll('[data-tag]').forEach((t) => t.onclick = () => { if (!tagSel.includes(t.dataset.tag)) toggleTag(t.dataset.tag) })
}

function render() {
  shown = []
  let html
  if (view === 'vyber') {
    const list = (view === 'vyber' ? allBank().filter((x) => picked.has(x.p.id)) : allBank()).filter((x) => hasTags(x.p))
    shown = list
    html = `<div class="top"><h1>${view === 'vyber' ? 'Můj výběr' : 'Tagy'} <small class="hint">${list.length} fotek</small></h1><div class="tools">${view === 'vyber' ? (list.length ? '<button class="btn danger" id="clearPick">Vyprázdnit výběr</button>' : '') : '<button class="btn" id="clearTags">Zrušit filtr</button>'}${dlBtn()}</div></div>`
    html += tagBar()
    const groups = {}; list.forEach((x, i) => { (groups[x.cat.name] ??= []).push([x, i]) })
    html += Object.keys(groups).length ? Object.entries(groups).map(([g, l]) => `<h2>${esc(g)} <small>${l.length}</small></h2><div class="grid">${l.map(([x, i]) => card(x.p, x.cat, x.sub, i)).join('')}</div>`).join('') : `<div class="empty">${view === 'vyber' ? 'Zatím nic nevybráno — fotky přidáš tlačítkem + na náhledu.' : 'Žádná fotka nemá všechny vybrané tagy.'}</div>`
  } else {
    const n = count(cur.slug)
    const subN = (name) => (S.bank[cur.slug]?.[name] || []).filter(hasTags).length
    const subs = cur.sub.filter((s) => !STATIC || subN(s[0])).map((s) => { const i = cur.sub.indexOf(s); return `<button data-i="${i}" class="${(view === 'hledat' && i === sub && !custom) || (STATIC && subSel.has(s[0])) ? 'on' : ''}">${esc(s[0])}<span>${subN(s[0])}</span></button>` }).join('')
    html = `<div class="top"><h1>${esc(cur.name)}</h1><div class="tools">
      ${STATIC ? '' : `<select id="src" class="btn" title="Zdroj pro hledání">${Object.entries(SRC).map(([k, v]) => `<option value="${k}" ${k === src ? 'selected' : ''}>${v}</option>`).join('')}</select>
      <button class="btn" id="fillCat" title="Doplní 8 fotek do každé podkategorie (Pexels → Pixabay → Openverse)">Doplnit kategorii</button>`}
      ${dlBtn()}</div></div>
      <div class="tabs ${STATIC ? 'stick' : ''}"><button id="vBank" class="${view === 'banka' && !subSel.size ? 'on' : ''}">${STATIC ? 'Vše' : 'Ve fotobance'}<span>${tagSel.length ? allBank().filter((x) => x.cat.slug === cur.slug && hasTags(x.p)).length : n}</span></button>${subs}</div>`
    if (view === 'hledat') {
      const q = custom || cur.sub[sub][1]
      shown = results.map((p) => ({ p, cat: cur, sub: cur.sub[sub][0] }))
      html += `<div class="row"><input id="q" value="${esc(q)}" title="Dotaz (anglicky dává víc výsledků)"><select id="ori"><option value="landscape">Na šířku</option><option value="portrait">Na výšku</option><option value="square">Čtverec</option><option value="">Všechny</option></select><button class="btn" id="go">Hledat</button><span class="hint">${SRC[src]} · <b>+</b> vybere do „${esc(cur.sub[sub][0])}“, klik na fotku otevře detail</span></div>`
      html += results.length ? `<div class="grid" id="grid">${shown.map((x, i) => card(x.p, x.cat, x.sub, i)).join('')}</div><button class="btn more" id="more">Načíst další</button>`
        : `<div class="empty" id="grid">Načítám z ${SRC[src]}…</div>`
    } else {
      html += tagBar()
      const entries = cur.sub.filter((s) => !subSel.size || subSel.has(s[0])).map((s) => [s[0], (S.bank[cur.slug]?.[s[0]] || []).filter(hasTags)]).filter(([, l]) => l.length)
      let i = 0
      html += entries.length ? entries.map(([s, l]) => { const items = l.map((p) => { shown.push({ p, cat: cur, sub: s }); return card(p, cur, s, i++) }); return `<h2>${esc(s)} <small>${l.length}</small></h2><div class="grid">${items.join('')}</div>` }).join('')
        : `<div class="empty">${tagSel.length ? 'V této kategorii žádná fotka nemá všechny vybrané tagy.' : 'V této kategorii zatím nic není. Vyber podkategorii nahoře a přidej fotky, nebo klikni na „Doplnit kategorii“.'}</div>`
    }
  }
  $('#main').innerHTML = html
  $('#mTitle').textContent = view === 'vyber' ? 'Můj výběr' : cur.name
  $('#main').querySelectorAll('[data-un]').forEach((b) => b.onclick = () => toggleTag(b.dataset.un))
  if ($('#clearTags2')) $('#clearTags2').onclick = () => { tagSel = []; renderSide(); render() }
  bindGrid(); renderPickbar()
  if ($('#ori')) $('#ori').value = ori
  $('#main').querySelectorAll('.tabs button[data-i]').forEach((b) => b.onclick = STATIC ? () => { const n = cur.sub[+b.dataset.i][0]; subSel.has(n) ? subSel.delete(n) : subSel.add(n); render() } : () => { sub = +b.dataset.i; custom = ''; view = 'hledat'; results = []; page = 1; render(); search() })
  if ($('#vBank')) $('#vBank').onclick = () => { view = 'banka'; subSel.clear(); render() }
  if ($('#clearTags')) $('#clearTags').onclick = () => { tagSel = []; view = 'banka'; renderSide(); render() }
  if ($('#src')) $('#src').onchange = (e) => { src = e.target.value; results = []; page = 1; if (view === 'hledat') { render(); search() } }
  if ($('#fillCat')) $('#fillCat').onclick = (e) => fill(e.target, cur.slug)
  if ($('#clearPick')) $('#clearPick').onclick = () => { picked.clear(); savePicked(); renderSide(); render() }
  if (STATIC) { if ($('#dl')) $('#dl').onclick = () => { if (picked.size) { view = 'vyber'; renderSide(); render() } else toast('Zatím nic nevybráno — fotky přidáš tlačítkem + na náhledu') }; if ($('#zipTop')) $('#zipTop').onclick = downloadZip; return }
  $('#dl').onclick = async (e) => { e.target.disabled = true; toast('Stahuji ve vysokém rozlišení…'); try { const r = await api('/api/download', { cat: '' }); toast(`Staženo ${r.downloaded}, už existovalo ${r.skipped}${r.errors.length ? `, chyby ${r.errors.length}` : ''}\n${r.dir}`) } catch (er) { toast(er.message) } e.target.disabled = false }
  if ($('#go')) { $('#go').onclick = () => { custom = $('#q').value.trim(); ori = $('#ori').value; results = []; page = 1; search() }; $('#q').onkeydown = (e) => { if (e.key === 'Enter') $('#go').click() }; $('#ori').onchange = () => $('#go').click() }
  if ($('#more')) $('#more').onclick = () => { page++; search(true) }
}

// ---------------------------------------------------------------- výběr
function dlBtn() { return STATIC ? (view === 'vyber' ? (picked.size ? `<button class="btn pri" id="zipTop">Stáhnout ZIP (${picked.size})</button>` : '') : `<button class="btn" id="dl">Můj výběr (${picked.size})</button>`) : '<button class="btn pri" id="dl">Stáhnout vybrané</button>' }
// aktivní filtr tagů nad mřížkou
function tagBar() {
  if (!tagSel.length) return ''
  const n = view === 'vyber' ? allBank().filter((x) => picked.has(x.p.id) && hasTags(x.p)).length : allBank().filter((x) => x.cat.slug === cur.slug && hasTags(x.p)).length
  return `<div class="tagbar"><span class="hint">Filtr:</span>${tagSel.map((t) => `<button class="chip on" data-un="${esc(t)}">${esc(t)} ✕</button>`).join('')}<span class="hint">${n} fotek</span><button class="chip" id="clearTags2">Zrušit filtr</button></div>`
}
// lišta dole: počet vybraných + stažení
function renderPickbar() {
  const bar = $('#pickbar'); if (!STATIC) return
  bar.classList.toggle('on', picked.size > 0)
  if (!picked.size || zipping) return
  bar.innerHTML = `<b>Vybráno ${picked.size}</b>${view === 'vyber' ? '' : '<button class="btn" id="pbShow">Zobrazit</button>'}<button class="btn pri" id="pbZip">Stáhnout ZIP</button><button class="btn" id="pbClear" title="Zrušit výběr">✕</button>`
  if ($('#pbShow')) $('#pbShow').onclick = () => { view = 'vyber'; renderSide(); render(); scrollTo(0, 0) }
  $('#pbZip').onclick = downloadZip
  $('#pbClear').onclick = () => { picked.clear(); savePicked(); renderSide(); render() }
}
// stažení vybraných fotek v plném rozlišení jako ZIP (kategorie/podkategorie/…)
let zipping = false
const loadJSZip = () => window.JSZip ? Promise.resolve(window.JSZip) : new Promise((ok, err) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'; sc.onload = () => ok(window.JSZip); sc.onerror = () => err(new Error('Nepodařilo se načíst JSZip')); document.head.appendChild(sc) })
const slugify = (t) => String(t).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')
async function downloadZip() {
  if (zipping) return
  const items = allBank().filter((x) => picked.has(x.p.id)); if (!items.length) return
  zipping = true; const bar = $('#pickbar')
  const prog = (t) => { bar.innerHTML = `<b>Stahuji…</b><span class="prog">${t}</span>` }
  try {
    const JSZip = await loadJSZip(); const zip = new JSZip()
    let done = 0, failed = 0, i = 0; prog(`0 / ${items.length}`)
    const worker = async () => { while (i < items.length) { const x = items[i++]
      const name = `${slugify(x.cat.name)}/${slugify(x.sub)}/${x.p.id}.jpg`
      try { const r = await fetch(new URL(x.p.large, location.href)); if (!r.ok) throw 0; zip.file(name, await r.blob()) } catch { failed++ }
      prog(`${++done} / ${items.length}`) } }
    await Promise.all([worker(), worker(), worker(), worker()])
    prog('balím ZIP…')
    const blob = await zip.generateAsync({ type: 'blob' })
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `fotobanka-vyber-${items.length}.zip`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000)
    toast(`Staženo ${done - failed} fotek${failed ? `, ${failed} se nepodařilo` : ''}`)
  } catch (e) { toast(e.message || 'Stažení selhalo') }
  zipping = false; renderPickbar()
}
function exportCsv() {
  const abs = (u) => new URL(u, location.href).href
  const rows = [['kategorie', 'podkategorie', 'id', 'zdroj', 'autor', 'licence', 'obrázek', 'stránka', 'tagy']]
  for (const x of allBank().filter((x) => picked.has(x.p.id))) rows.push([x.cat.name, x.sub, x.p.id, x.p.source, x.p.photographer, x.p.license, abs(x.p.large), x.p.page || '', (x.p.tags || []).join(' ')])
  const csv = rows.map((r) => r.map((v) => `"${String(v ?? '').replace(/"/g, '""')}"`).join(';')).join('\n')
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv' })); a.download = 'fotobanka-vyber.csv'; a.click()
}
async function pick(i) {
  const x = shown[i]; if (!x) return
  if (STATIC) {
    const on = !picked.has(x.p.id); on ? picked.add(x.p.id) : picked.delete(x.p.id); savePicked()
    const el = $(`.ph[data-i="${i}"]`)
    if (el) { el.classList.toggle('sel', on); const b = el.querySelector('.chk'); b.textContent = on ? '✓' : '+'; b.title = on ? 'Odebrat z výběru' : 'Přidat do výběru' }
    if ($('#dl')) $('#dl').textContent = `Můj výběr (${picked.size})`
    if ($('#mineBtn')) $('#mineBtn').textContent = `Můj výběr (${picked.size})`
    renderPickbar()
    if ($('#dlg').open) renderDetail()
    return
  }
  try {
    const r = await api('/api/toggle', { cat: x.cat.slug, sub: x.sub, photo: x.p })
    S.bank[x.cat.slug] ??= {}; S.bank[x.cat.slug][x.sub] ??= []
    if (r.selected) S.bank[x.cat.slug][x.sub].push(x.p)
    else { S.bank[x.cat.slug][x.sub] = S.bank[x.cat.slug][x.sub].filter((p) => p.id !== x.p.id); if (!S.bank[x.cat.slug][x.sub].length) delete S.bank[x.cat.slug][x.sub] }
    toast(r.selected ? `Přidáno do „${x.sub}“` : `Odebráno z „${x.sub}“`)
    const el = $(`.ph[data-i="${i}"]`)
    if (el) { el.classList.toggle('sel', r.selected); const b = el.querySelector('.chk'); b.textContent = r.selected ? '✓' : '+'; b.title = r.selected ? 'Odebrat z fotobanky' : 'Vybrat do fotobanky' }
    if (view === 'hledat') { const tab = $('#main').querySelectorAll('.tabs button[data-i] span')[sub]; if (tab) tab.textContent = (S.bank[cur.slug]?.[cur.sub[sub][0]] || []).length; $('#vBank span').textContent = count(cur.slug) }
    renderSide()
    if ($('#dlg').open) renderDetail()
  } catch (e) { toast(e.message) }
}

// ---------------------------------------------------------------- detail
function openDetail(i) { dlgIdx = i; renderDetail(); if (!$('#dlg').open) $('#dlg').showModal() }
function renderDetail() {
  const x = shown[dlgIdx]; if (!x) return $('#dlg').close()
  const inBank = !STATIC && !!bankFind(x.cat.slug, x.sub, x.p.id)
  const isPicked = picked.has(x.p.id)
  const p = bankFind(x.cat.slug, x.sub, x.p.id) || x.p
  const tags = p.tags || []
  $('#dlg').innerHTML = `<button class="dl-close" id="dX" title="Zavřít (Esc)">✕</button><div class="dl">
    <div class="dl-img"><img src="${esc(p.large)}" alt="${esc(p.alt)}"><button class="dl-nav dl-prev" id="dP" title="Předchozí (←)">‹</button><button class="dl-nav dl-next" id="dN" title="Další (→)">›</button></div>
    <div class="dl-side">
      <div><div class="k">${esc(x.cat.name)} · ${esc(x.sub)}</div><p style="color:#fff;font-size:14px;margin-top:4px">${esc(p.alt || 'Bez popisu')}</p></div>
      <p>${esc(p.source || '')}${p.photographer ? ' · ' + esc(p.photographer) : ''}${p.w ? ` · ${p.w}×${p.h} px` : ''}${p.license ? ` · licence ${esc(p.license)}` : ''}<br>${p.page ? `<a href="${esc(p.page)}" target="_blank" rel="noopener">Otevřít zdroj ↗</a> · ` : ''}${p.original ? `<a href="${esc(p.original)}" target="_blank" rel="noopener">originál v plném rozlišení ↗</a>` : ''}</p>
      ${STATIC ? `<a class="btn pri" href="${esc(p.large)}" download target="_blank" rel="noopener">Stáhnout fotku</a><button class="btn ${isPicked ? 'danger' : ''}" id="dPick">${isPicked ? 'Odebrat z výběru' : 'Přidat do výběru'} <small>(mezerník)</small></button>` : `<button class="btn ${inBank ? 'danger' : 'pri'}" id="dPick">${inBank ? 'Odebrat z fotobanky' : 'Vybrat do fotobanky'} <small>(mezerník)</small></button>`}
      <div><div class="k">Tagy</div>
        <div class="dl-tags" style="margin-top:6px">${tags.map((t) => `<span>${esc(t)}${inBank ? `<button data-rm="${esc(t)}" title="Odebrat tag">×</button>` : ''}</span>`).join('') || '<p>Žádné tagy</p>'}</div></div>
      ${inBank ? `<input id="dTag" placeholder="Přidat vlastní tag + Enter" autocomplete="off"><div class="sugg">${SUGGEST.filter((t) => !tags.includes(t)).map((t) => `<button data-add="${esc(t)}">+ ${esc(t)}</button>`).join('')}</div>` : STATIC ? '' : '<p>Tagy půjdou upravit po vybrání do fotobanky.</p>'}
      <p class="hint" style="margin-top:auto;color:#8aa0a4">${dlgIdx + 1} / ${shown.length} · ← → listování · mezerník vybrat/odebrat · Esc zavřít</p>
    </div></div>`
  $('#dX').onclick = () => $('#dlg').close()
  $('#dP').onclick = () => step(-1); $('#dN').onclick = () => step(1)
  $('#dPick').onclick = () => pick(dlgIdx)
  $('#dlg').querySelectorAll('[data-rm]').forEach((b) => b.onclick = () => saveTags(tags.filter((t) => t !== b.dataset.rm)))
  $('#dlg').querySelectorAll('[data-add]').forEach((b) => b.onclick = () => saveTags([...tags, b.dataset.add]))
  if ($('#dTag')) $('#dTag').onkeydown = (e) => { e.stopPropagation(); if (e.key === 'Enter' && e.target.value.trim()) saveTags([...tags, e.target.value.trim().toLowerCase()]) }
}
const step = (d) => { if (!shown.length) return; dlgIdx = (dlgIdx + d + shown.length) % shown.length; renderDetail() }
async function saveTags(tags) {
  const x = shown[dlgIdx]
  try {
    const r = await api('/api/tags', { cat: x.cat.slug, sub: x.sub, id: x.p.id, tags })
    const p = bankFind(x.cat.slug, x.sub, x.p.id); p.tags = r.tags; p.tagsManual = true; x.p.tags = r.tags
    renderDetail(); renderSide()
    const el = $(`.ph[data-i="${dlgIdx}"] .tags`); if (el) el.innerHTML = r.tags.map((t) => `<span data-tag="${esc(t)}">${esc(t)}</span>`).join('')
  } catch (e) { toast(e.message) }
}
document.addEventListener('keydown', (e) => {
  if (!$('#dlg').open || e.target.tagName === 'INPUT') return
  if (e.key === 'ArrowRight') step(1); else if (e.key === 'ArrowLeft') step(-1); else if (e.key === ' ') { e.preventDefault(); pick(dlgIdx) }
})
// po zavření detailu v pohledu fotobanky/tagu překreslit (mohly se odebrat fotky nebo změnit tagy)
$('#dlg').addEventListener('close', () => { if (view !== 'hledat') render() })
$('#dlg').addEventListener('click', (e) => { if (e.target === $('#dlg')) $('#dlg').close() })

// ---------------------------------------------------------------- hledání a doplnění
async function fill(btn, cat) {
  btn.disabled = true; toast('Doplňuji (Pexels → Pixabay → Openverse)… pár minut')
  try { const r = await api('/api/autofill', { cat, perSub: 8, source: FILL }); toast(`Přidáno ${r.added} fotek${r.errors.length ? `\nChyby: ${r.errors.slice(0, 3).join('\n')}` : ''}`); view = 'banka'; await load() } catch (e) { toast(e.message) }
  btn.disabled = false
}
async function search(append) {
  if (view !== 'hledat') return
  const q = custom || cur.sub[sub][1]
  try {
    const r = await api(`/api/search?source=${src}&q=${encodeURIComponent(q)}&page=${page}&orientation=${ori}&sub=${encodeURIComponent(cur.sub[sub][0])}`)
    results = append ? results.concat(r.photos.filter((p) => !results.some((x) => x.id === p.id))) : r.photos
    render()
    if (!r.photos.length && !append) $('#grid').outerHTML = '<div class="empty">Nic nenalezeno — zkus jiný dotaz (anglicky) nebo jiný zdroj.</div>'
  } catch (e) { toast(e.message); if ($('#grid')) $('#grid').outerHTML = `<div class="empty">${esc(e.message)}</div>` }
}

$('#filter').oninput = renderSide
$('#segCat').onclick = () => showPane('cat'); $('#segTag').onclick = () => showPane('tag')
$('#menuBtn').onclick = () => document.body.classList.add('menu')
document.addEventListener('click', (e) => { if (document.body.classList.contains('menu') && !e.target.closest('aside') && e.target.id !== 'menuBtn') closeMenu() })
load().then(() => { if (STATIC && view === 'hledat') { view = 'banka'; render() } if (view === 'hledat') search() })
</script>
</body>
